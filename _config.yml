title:  IEEE CyberSciTech/DASC/PICom/CBDCom 2027
description: CyberSciTech 2027



# The site is served at https://cyber-science.org/2027/.
# Layouts and includes build every internal link and asset path from this
# value (site.baseurl), so this is the only place the year prefix is set.
baseurl: /2027
color-scheme: "#1B365D" # the scheme can be any HEX code like "#00aa55"
dasc-scheme: "#88aef7"

sass:
  sass_dir: /assets/css/_sass
  style: compressed

include:
  - _pages

exclude:
  - .sass-cache
